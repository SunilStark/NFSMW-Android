name: Android ARM64

# Manual only in this copy: the build needs the C++ generated from your own default.xex (app/generated), which is
# never in the repository, so a run on GitHub fails at CMake's include(generated/rexglue.cmake). Builds happen on
# the PC that has the game (CLAUDE.md).
on:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build ARM64 debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nfsmw-android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
