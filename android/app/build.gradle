plugins {
    id 'com.android.application'
}

// Edition-specific builds and shared-SDK packaging adapted from
// victorgbd/NFSMW-Recompiled-Mobile (GPL-3.0), dd76acb032ccbd7b0494985242489cd9cd90a939.
def editionId = providers.gradleProperty('nfsmw.edition').getOrElse('pal_es')
if (!(editionId ==~ /[a-z][a-z0-9_]{0,31}/)) throw new GradleException('Invalid edition ID')
def editionApp = editionId == 'pal_es' ? 'app' : "app_${editionId}"
def editionLibrary = editionId == 'pal_es' ? 'main' : "main_${editionId}"
def principal = [id: 'pal_es', name: 'PAL Spain',
        sha256: 'aad15fc218d034de3131f746e0b763dd8049a40dd676efc87667fcaf4fc72694',
        language: 5, country: 31, library: 'main']
if (editionId != 'pal_es') {
    def descriptor = file("../../out/editions/${editionId}/edition.json")
    if (!descriptor.isFile()) throw new GradleException('Run tools/android/editions.py prepare first')
    principal = new groovy.json.JsonSlurper().parse(descriptor)
    if (principal.id != editionId || principal.app != editionApp) throw new GradleException('Invalid edition descriptor')
    principal.library = editionLibrary
}
def editions = [principal]
// A build that installs beside the published app (-Pnfsmw.applicationIdSuffix=.dev): its own package, data and
// launcher name, the same game folder. Empty: the published package.
def idSuffix = providers.gradleProperty('nfsmw.applicationIdSuffix').getOrElse('')
if (!(idSuffix ==~ /(\.[a-z][a-z0-9_]{0,15})?/)) throw new GradleException('Invalid application ID suffix')
// Native parallelism for a PC with little RAM (-Pnfsmw.nativeJobs=2 -Pnfsmw.ltoJobs=2); 0 leaves it to Ninja and
// every core (src/main/cpp/CMakeLists.txt).
def nativeJobs = providers.gradleProperty('nfsmw.nativeJobs').getOrElse('0')
def ltoJobs = providers.gradleProperty('nfsmw.ltoJobs').getOrElse('0')
if (!(nativeJobs ==~ /[0-9]{1,2}/) || !(ltoJobs ==~ /[0-9]{1,2}/)) throw new GradleException('Invalid job count')
// Arm Streamline reads the Mali's hardware counters only from a debuggable app on a phone that is not rooted
// (-Pnfsmw.debuggable=true). Only with an ID suffix, so the published package is never built debuggable.
def debuggableBuild = providers.gradleProperty('nfsmw.debuggable').getOrElse('false') == 'true'
if (debuggableBuild && idSuffix.isEmpty()) throw new GradleException('nfsmw.debuggable needs nfsmw.applicationIdSuffix')
def editionsDir = providers.gradleProperty('nfsmw.editionsDir').orNull
if (editionsDir != null) {
    if (editionId != 'pal_es') throw new GradleException('Multi-edition packages require the PAL base')
    def staging = file(editionsDir)
    def extra = new groovy.json.JsonSlurper().parse(new File(staging, 'editions.json'))
    if (!(extra instanceof List)) throw new GradleException('Invalid staging manifest')
    extra.each { e ->
        if (!(e.id ==~ /[a-z][a-z0-9_]{0,31}/) || e.library != "main_${e.id}") {
            throw new GradleException('Invalid staged edition')
        }
        def lib = new File(staging, "jniLibs/arm64-v8a/lib${e.library}.so")
        if (!lib.isFile()) throw new GradleException("Missing compiled module: ${e.id}")
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        lib.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = input.read(buffer)) > 0) digest.update(buffer, 0, count)
        }
        if (digest.digest().encodeHex().toString() != e.native_sha256) {
            throw new GradleException("Compiled module hash mismatch: ${e.id}")
        }
        editions.add(e)
    }
    def expected = extra.collect { "lib${it.library}.so".toString() }.toSet()
    def actual = fileTree(new File(staging, 'jniLibs')).files.collect { it.name }.toSet()
    if (actual != expected) throw new GradleException('Unexpected staging libraries')
}
def ids = [] as Set
def hashes = [] as Set
def libraries = [] as Set
def editionTable = editions.collect { e ->
    if (!(e.id ==~ /[a-z][a-z0-9_]{0,31}/) || !(e.sha256 ==~ /[a-f0-9]{64}/)
            || !(e.language.toString() ==~ /[0-9]{1,3}/) || !(e.country.toString() ==~ /[0-9]{1,3}/)
            || !(e.library == 'main' || e.library == "main_${e.id}")
            || !e.name || e.name.toString().find(/[|;\r\n]/)
            || !ids.add(e.id) || !hashes.add(e.sha256) || !libraries.add(e.library)) {
        throw new GradleException('Invalid or duplicate compiled edition metadata')
    }
    [e.id, e.name, e.sha256, e.language, e.country, e.library].join('|')
}.join(';')

android {
    namespace 'com.nfsmw.android'
    compileSdk 35

    buildFeatures { buildConfig true }

    sourceSets {
        main.java.srcDirs += ["$rootDir/../sdk/thirdparty/sdl3/android-project/app/src/main/java"]
        if (editionsDir != null) main.jniLibs.srcDirs += ["${file(editionsDir)}/jniLibs"]
    }

    defaultConfig {
        applicationId 'com.nfsmw.android' + idSuffix
        manifestPlaceholders = [appLabel: idSuffix ? "NFS Most Wanted (${idSuffix.substring(1)})" : 'Need for Speed Most Wanted']
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '0.8.2'
        buildConfigField 'String', 'GAME_EDITIONS', groovy.json.JsonOutput.toJson(editionTable)
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++23'
                arguments '-DANDROID_STL=c++_shared'
                arguments "-DNFSMW_EDITION_APP=${editionApp}", "-DNFSMW_EDITION_LIBRARY=${editionLibrary}"
                arguments "-DNFSMW_TRABAJOS=${nativeJobs}", "-DNFSMW_TRABAJOS_LTO=${ltoJobs}"
            }
        }
    }

    packaging { jniLibs { useLegacyPackaging true } }

    buildTypes {
        release {
            minifyEnabled false
            debuggable debuggableBuild
            signingConfig signingConfigs.debug
            // AGP builds release natives as RelWithDebInfo (-O2 -g); the game wants the SDK's Release
            // flags (-O3, no asserts) and ThinLTO (src/main/cpp/CMakeLists.txt).
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.30.5'
        }
    }

    ndkVersion '28.2.13676358'
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
